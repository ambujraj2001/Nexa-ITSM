<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base { html, body { margin: 0; padding: 0; } body { overscroll-behavior: none; } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "background": "#f8f9ff", "on-surface": "#0b1c30", "on-secondary-container": "#fffbff", "outline-variant": "#c6c6cd", "error": "#ba1a1a", "surface-variant": "#d3e4fe", "error-container": "#ffdad6", "on-tertiary-fixed": "#002114", "tertiary-fixed-dim": "#68dba9", "primary-fixed": "#dae2fd", "on-primary-container": "#7c839b", "on-background": "#0b1c30", "on-tertiary-fixed-variant": "#005137", "secondary": "#4648d4", "primary": "#000000", "primary-fixed-dim": "#bec6e0", "secondary-fixed-dim": "#c0c1ff", "on-primary": "#ffffff", "inverse-surface": "#213145", "surface-tint": "#565e74", "tertiary-fixed": "#85f8c4", "tertiary": "#000000", "surface-container-highest": "#d3e4fe", "surface": "#f8f9ff", "tertiary-container": "#002114", "surface-container-lowest": "#ffffff", "inverse-on-surface": "#eaf1ff", "outline": "#76777d", "on-primary-fixed": "#131b2e", "surface-container-high": "#dce9ff", "secondary-container": "#6063ee", "on-secondary-fixed": "#07006c", "inverse-primary": "#bec6e0", "primary-container": "#131b2e", "surface-bright": "#f8f9ff", "on-primary-fixed-variant": "#3f465c", "on-error-container": "#93000a", "secondary-fixed": "#e1e0ff", "surface-dim": "#cbdbf5", "on-surface-variant": "#45464d", "on-tertiary-container": "#069669", "on-secondary": "#ffffff", "on-error": "#ffffff", "on-tertiary": "#ffffff", "surface-container-low": "#eff4ff", "on-secondary-fixed-variant": "#2f2ebe", "surface-container": "#e5eeff" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "gutter": "1rem", "space-md": "0.75rem", "margin": "1.5rem", "space-lg": "1.25rem", "space-xl": "2rem", "space-sm": "0.5rem", "space-xs": "0.25rem" }, "fontFamily": { "body-sm": [ "Geist" ], "body-lg": [ "Geist" ], "label-code": [ "JetBrains Mono" ], "body-md": [ "Geist" ], "label-caps": [ "Geist" ], "headline-sm": [ "Geist" ], "display-lg": [ "Geist" ], "headline-md": [ "Geist" ], "headline-lg": [ "Geist" ] }, "fontSize": { "body-sm": [ "12px", { "lineHeight": "16px", "letterSpacing": "0em", "fontWeight": "400" } ], "body-lg": [ "15px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "400" } ], "label-code": [ "12px", { "lineHeight": "16px", "letterSpacing": "-0.01em", "fontWeight": "400" } ], "body-md": [ "13px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" } ], "label-caps": [ "11px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "600" } ], "headline-sm": [ "16px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "500" } ], "display-lg": [ "32px", { "lineHeight": "40px", "letterSpacing": "-0.025em", "fontWeight": "600" } ], "headline-md": [ "20px", { "lineHeight": "28px", "letterSpacing": "-0.015em", "fontWeight": "500" } ], "headline-lg": [ "24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" } ] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased"><main class="w-full min-h-screen bg-surface flex flex-col justify-center items-center px-margin py-space-xl"><div class="flex flex-col w-full">
<div class="relative w-full flex items-center justify-center py-space-xl px-gutter overflow-hidden">
<!-- Subtle architectural background ambience -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center">
<div class="w-[640px] h-[640px] rounded-full bg-surface-container-high/40 blur-[120px] -translate-y-8"></div>
<div class="absolute -top-32 right-1/4 w-80 h-80 rounded-full bg-secondary-fixed/30 blur-[90px]"></div>
</div>
<!-- Main Auth Card Container -->
<div class="relative z-10 w-full max-w-[440px] mx-auto flex flex-col items-center">
<!-- Brand Pill / Monogram Header -->
<div class="mb-space-lg flex items-center gap-space-xs group">
<div class="w-8 h-8 rounded-lg bg-on-surface text-surface flex items-center justify-center font-display-lg text-[15px] font-semibold tracking-tighter shadow-sm">
          N
        </div>
<div class="flex items-baseline gap-1.5 pl-1">
<span class="font-headline-md text-headline-md tracking-tight font-semibold text-on-surface">Nexa</span>
<span class="font-label-caps text-label-caps text-on-surface-variant bg-surface-container px-1.5 py-0.5 rounded tracking-widest uppercase text-[10px]">AI ITSM</span>
</div>
</div>
<!-- Auth Main Panel -->
<div class="w-full bg-surface-container-lowest rounded-xl p-8 sm:p-10 shadow-sm flex flex-col">
<!-- Typographic Header -->
<div class="flex flex-col text-left space-y-1 mb-space-lg">
<h1 class="font-display-lg text-display-lg text-on-surface font-semibold tracking-tight">
            Welcome back.
          </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
            Sign in to your technical IT workspace.
          </p>
</div>
<!-- Primary Form -->
<form class="flex flex-col gap-space-md" id="auth-form" onsubmit="event.preventDefault();">
<div class="flex flex-col space-y-1.5 text-left">
<div class="flex items-center justify-between">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider text-[10px]" for="work-email">
                Work Email
              </label>
<span class="font-label-code text-label-code text-outline text-[11px]">SAML / OIDC</span>
</div>
<div class="relative flex items-center">
<input class="w-full h-10 px-3 font-body-md text-body-md bg-surface-container-low text-on-surface placeholder:text-outline rounded-lg transition-colors duration-150 focus:bg-surface-container-lowest focus:outline-none" id="work-email" placeholder="name@company.com" required="" type="email"/>
<span class="material-symbols-outlined absolute right-3 text-outline text-[18px] pointer-events-none" id="email-validation-icon">
                mail
              </span>
</div>
</div>
<!-- Submit / Action Button -->
<button class="w-full h-10 bg-on-surface hover:bg-inverse-surface active:bg-primary-container text-surface-container-lowest font-body-md text-body-md font-medium rounded-lg flex items-center justify-center gap-space-xs transition-all duration-150 shadow-sm group" id="continue-button" type="submit">
<span>Continue</span>
<span class="material-symbols-outlined text-[16px] transition-transform duration-150 group-hover:translate-x-0.5">
              arrow_forward
            </span>
</button>
</form>
<!-- Minimal Hairline Divider -->
<div class="relative my-space-lg flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full h-[1px] bg-surface-container"></div>
</div>
<span class="relative px-3 bg-surface-container-lowest font-label-caps text-label-caps text-outline uppercase tracking-wider text-[10px]">
            or
          </span>
</div>
<!-- SSO Identity Providers -->
<div class="flex flex-col gap-2.5">
<!-- Google SSO -->
<button class="w-full h-10 px-4 bg-surface-container-low hover:bg-surface-container text-on-surface font-body-md text-body-md rounded-lg flex items-center justify-between transition-colors duration-150 group" type="button">
<div class="flex items-center gap-3">
<svg aria-hidden="true" class="w-4 h-4 flex-shrink-0" viewbox="0 0 24 24">
<path d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z" fill="#EA4335"></path>
<path d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z" fill="#4285F4"></path>
<path d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.8s.2-2.1.4-2.8L1.9 6.3C.7 8.7 0 10.3 0 12s.7 3.3 1.9 5.7l3.7-2.9z" fill="#FBBC05"></path>
<path d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z" fill="#34A853"></path>
</svg>
<span class="font-medium text-on-surface">Continue with Google</span>
</div>
<span class="font-label-code text-label-code text-outline text-[11px] opacity-0 group-hover:opacity-100 transition-opacity">SSO</span>
</button>
<!-- Microsoft SSO -->
<button class="w-full h-10 px-4 bg-surface-container-low hover:bg-surface-container text-on-surface font-body-md text-body-md rounded-lg flex items-center justify-between transition-colors duration-150 group" type="button">
<div class="flex items-center gap-3">
<svg aria-hidden="true" class="w-4 h-4 flex-shrink-0" viewbox="0 0 23 23">
<path d="M1 1h10v10H1z" fill="#f35325"></path>
<path d="M12 1h10v10H12z" fill="#81bc06"></path>
<path d="M1 12h10v10H1z" fill="#05a6f0"></path>
<path d="M12 12h10v10H12z" fill="#ffba08"></path>
</svg>
<span class="font-medium text-on-surface">Continue with Microsoft</span>
</div>
<span class="font-label-code text-label-code text-outline text-[11px] opacity-0 group-hover:opacity-100 transition-opacity">Azure AD</span>
</button>
</div>
<!-- Registration Link -->
<div class="mt-space-lg pt-2 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
            Don't have an account?
            <a class="font-medium text-on-surface hover:text-secondary inline-flex items-center gap-0.5 ml-1 transition-colors" href="#register">
<span>Get started</span>
<span class="material-symbols-outlined text-[13px]">north_east</span>
</a>
</p>
</div>
</div>
<!-- Trust & Security Verification Badge -->
<div class="mt-space-lg flex items-center gap-space-sm px-3 py-1.5 rounded-full bg-surface-container-low text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-tertiary-container" style="font-variation-settings: 'FILL' 1;">
          verified_user
        </span>
<span class="font-label-code text-label-code text-[11px] tracking-tight">
          Protected by enterprise SSO &amp; Zero-trust authentication
        </span>
</div>
<!-- Operational Status Indicator -->
<div class="mt-space-md flex items-center gap-2">
<span class="inline-block w-1.5 h-1.5 rounded-full bg-on-tertiary-container animate-pulse"></span>
<span class="font-label-code text-label-code text-[11px] text-outline">
          Nexa Cloud Core: 99.99% operational
        </span>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const input = document.getElementById('work-email');
    const icon = document.getElementById('email-validation-icon');
    
    if (input && icon) {
      input.addEventListener('input', () => {
        const val = input.value.trim();
        const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
        if (valid) {
          icon.textContent = 'check_circle';
          icon.classList.remove('text-outline');
          icon.classList.add('text-on-tertiary-container');
        } else {
          icon.textContent = 'mail';
          icon.classList.remove('text-on-tertiary-container');
          icon.classList.add('text-outline');
        }
      });
    }
  })();
</script></main></body></html>
